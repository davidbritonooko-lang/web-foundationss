<!DOCTYPE html>

  <html lang="en">

    <head>

      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>QuickNotes App</title>
      <link rel="stylesheet" href="style.css">
      <script src="api.js" defer></script>

    </head>

    <body>

      <header>
        <h1>QuickNotes</h1>
        <p>Manage your notes via the online API service.</p>
      </header>

      <main>
        <section>
          <h2>Load Notes</h2>
          <button id="load-btn">Load notes</button>
          <p id="status">Click "Load notes" to fetch data from the server.</p>
        </section>

        <section>
          <h2>Create a Note</h2>
          <form id="note-form">
            <div class="form-group">
              <label for="title-input">Title</label>
              <input type="text" id="title-input" placeholder="Note title..." />
            </div>
            <div class="form-group">
              <label for="body-input">Body</label>
              <textarea id="body-input" placeholder="Type your note content..."></textarea>
            </div>
            <button id="submit-btn" type="submit">Add Note</button>
          </form>
        </section>

        <section>
          <h2>Your Notes</h2>
          <ul id="notes-list"></ul>
        </section>
      </main>

      <footer>
        <p>&copy; 2026 QuickNotes App</p>
      </footer>

    </body>

  </html>
