<!DOCTYPE html>

  <html lang="en">

    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <title>QuickNotes - Draft Tool</title>

      <link rel="stylesheet" href="style.css" />

      <script src="script.js" defer></script>

    </head>

    <body>
      
      <main>
        <h1>QuickNotes Editor</h1>
        
        <div>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>

        <div class="form-group">
          <label for="note-text">Note draft</label>
          <textarea id="note-text" placeholder="Type your note here..."></textarea>
        </div>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <button id="clear-btn" type="button">Clear</button>
      </main>

    </body>

  </html>
